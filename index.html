<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TinyGPT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101010;color:#eee;font-family:Arial,sans-serif;height:100vh;display:flex;justify-content:center}#app{width:100%;max-width:720px;height:100vh;display:flex;flex-direction:column}header{padding:16px;background:#181818;border-bottom:1px solid #333}h1{margin:0;font-size:21px}header p{margin:5px 0 0;color:#aaa;font-size:13px}#status{padding:8px 16px;background:#141414;color:#8ab4ff;font-size:12px;border-bottom:1px solid #292929}#chat{flex:1;overflow-y:auto;padding:16px}.message{max-width:86%;padding:11px 14px;margin:0 0 10px;border-radius:13px;line-height:1.45;white-space:pre-wrap}.user{margin-left:auto;background:#315fce}.ai{background:#292929}#controls{display:flex;gap:8px;padding:8px 10px;background:#181818}button{border:0;border-radius:10px;padding:9px 13px;background:#333;color:#fff;cursor:pointer}button:hover{background:#444}#inputArea{display:flex;gap:8px;padding:10px;background:#181818;border-top:1px solid #333}#input{flex:1;min-width:0;padding:13px;border:0;border-radius:10px;background:#292929;color:#fff;outline:none;font-size:16px}#send{background:#315fce}#send:hover{background:#4272df}
</style>
</head>
<body>
<div id="app"><header><h1>🤖 TinyGPT</h1><p>Tiny local AI with basic math learning</p></header><div id="status">Training...</div><div id="chat"></div><div id="controls"><button onclick="trainMore()">Train More</button><button onclick="showKnowledge()">Knowledge</button><button onclick="clearChat()">Clear Chat</button></div><div id="inputArea"><input id="input" autocomplete="off" placeholder="Try: 12 × 8 + 4"><button id="send" onclick="send()">Send</button></div></div>
<script>
const AI={examples:0,knowledge:{"+":{},"-":{},"*":{},"/":{}}};
function teach(a,o,b,r){AI.knowledge[o][a]??={};AI.knowledge[o][a][b]=r;AI.examples++}
function train(){for(let a=0;a<=20;a++)for(let b=0;b<=20;b++){teach(a,"+",b,a+b);teach(a,"-",b,a-b);teach(a,"*",b,a*b)}for(let a=0;a<=100;a++)for(let b=1;b<=20;b++)if(a%b===0)teach(a,"/",b,a/b)}
function trainMore(){let before=countKnowledge();for(let a=0;a<=100;a++)for(let b=0;b<=100;b++){teach(a,"+",b,a+b);teach(a,"-",b,a-b);teach(a,"*",b,a*b)}for(let a=0;a<=1000;a++)for(let b=1;b<=100;b++)if(a%b===0)teach(a,"/",b,a/b);updateStatus();addMessage("🧠 I trained on "+(countKnowledge()-before)+" additional math examples.","ai")}
function countKnowledge(){let n=0;for(const o of Object.keys(AI.knowledge))for(const a in AI.knowledge[o])n+=Object.keys(AI.knowledge[o][a]).length;return n}
function normalize(s){return s.replace(/×/g,"*").replace(/[xX]/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/\s+/g,"")}
function calculateExpression(text){let s=normalize(text.replace(/^(what is|calculate|solve)\s*/i,""));if(!/^[0-9+*/().-]+$/.test(s)||!/[+*/-]/.test(s))return null;if(/[a-zA-Z]/.test(s))return null;try{const tokens=s.match(/\d+(?:\.\d+)?|[+*/()-]/g);if(!tokens||tokens.join("")!==s)return null;let nums=[],ops=[];const prec={"+":1,"-":1,"*":2,"/":2};function apply(){const o=ops.pop(),b=nums.pop(),a=nums.pop();if(o==="/"&&b===0)throw Error("divide");nums.push(o==="+"?a+b:o==="-"?a-b:o==="*"?a*b:a/b)}for(const t of tokens){if(/^\d/.test(t))nums.push(Number(t));else if(t==="(")ops.push(t);else if(t===")"){while(ops.length&&ops.at(-1)!=="(")apply();if(ops.pop()!=="(")return null}else{while(ops.length&&ops.at(-1)!=="("&&prec[ops.at(-1)]>=prec[t])apply();ops.push(t)}}while(ops.length)apply();return nums.length===1?nums[0]:null}catch(e){return e.message==="divide"?{error:"You cannot divide by zero."}:null}}
function send(){const input=document.getElementById("input"),s=input.value.trim();if(!s)return;input.value="";addMessage(s,"user");const result=calculateExpression(s);if(result!==null){if(result&&result.error){addMessage("❌ "+result.error,"ai");return}const answer=Number.isInteger(result)?String(result):Number(result.toFixed(12)).toString();addMessage("🧠 I can solve that expression.\n\n"+s+" = "+answer,"ai");teachExpression(s,result);updateStatus();return}const l=s.toLowerCase();if(/^(hi|hello|hey)\b/.test(l)){addMessage("Hello! 👋 I'm TinyGPT. Try a math problem like 3875384654 - 376548645843653 + 78345683653 + 7336875365736.","ai");return}if(l.includes("your name")){addMessage("I'm TinyGPT. 🤖","ai");return}if(l.includes("how are you")){addMessage("I'm running locally inside this HTML file!","ai");return}if(l.includes("what can you do")||l==="help"){addMessage("I can solve expressions using +, -, ×, ÷, parentheses, decimals, and very large integer values.\n\nExamples:\n23 + 19\n50 - 17\n8 × 7\n144 ÷ 12\n10 + 5 × 3\n(20 - 4) × 2","ai");return}addMessage("I don't understand that yet. Try a math expression using +, -, ×, or ÷.","ai")}
function teachExpression(s,r){const parts=normalize(s).split(/(?=[+*/-])|(?<=[+*/-])/).filter(Boolean);if(parts.length===3){const a=Number(parts[0]),o=parts[1],b=Number(parts[2]);if(Number.isFinite(a)&&Number.isFinite(b)&&AI.knowledge[o])teach(a,o,b,r)}}
function addMessage(t,type){const e=document.createElement("div");e.className="message "+type;e.textContent=t;document.getElementById("chat").appendChild(e);const c=document.getElementById("chat");c.scrollTop=c.scrollHeight}
function updateStatus(){document.getElementById("status").textContent="🧠 Math knowledge: "+countKnowledge()+" examples"}
function showKnowledge(){addMessage("🧠 Current math knowledge:\n\n➕ Addition\n➖ Subtraction\n✖️ Multiplication\n➗ Division\n\nStored examples: "+countKnowledge()+"\n\nI can also calculate multi-step expressions and very large numbers.","ai")}
function clearChat(){document.getElementById("chat").innerHTML="";addMessage("Chat cleared. My math knowledge is still here! 🧠","ai")}
document.getElementById("input").addEventListener("keydown",e=>{if(e.key==="Enter")send()});train();updateStatus();addMessage("Hi! I'm TinyGPT. 🤖\n\nI've been trained on basic addition, subtraction, multiplication, and division. I can also solve multi-step expressions and very large numbers.\n\nTry:\n5 + 7\n20 - 8\n6 × 9\n100 ÷ 4\n10 + 5 × 3","ai");
</script>
</body>
</html>
